<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <form id="signupForm">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Signup
        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <p id="message"></p>

</div>

<script src="js/signup.js"></script>

</body>
</html>
